name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    name: sim build + test + structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet restore RTS.sln
      - run: dotnet build RTS.sln --no-restore -warnaserror
      - run: dotnet test sim/tests/Sim.Tests.csproj --no-build --nologo
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/smoke.json
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/chokepoint-30.json --expect 1727e6d2adb5efb8
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/skirmish-10v10.json --expect b379d768bf134db0  # re-pinned for T05 guard (idle units hold, chase, return): 0fbba65f760574ce -> e97bc24d4f7fd6c3; T29 re-pin: Rifleman marks on hit (+25% Coalition damage on marked targets): e97bc24d4f7fd6c3 -> b379d768bf134db0
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/tri-point-30.json --expect 255bc1d1c339b9a5  # re-pinned for T34 resource fields: 5526cd76fdce4754 -> c209ac08ca9974f4 (9 fields of ore now in the economy hash; same battle, 17 survivors); T29 re-pin: Rifleman marks on hit (+25% Coalition damage on marked targets): c209ac08ca9974f4 -> f1f744d1b3354994; T28 re-pin: neutral oil derrick on the central rig (one more unit in the roster, ids after it shift; nobody touches it): f1f744d1b3354994 -> 0d3b47e3fa717ca1; T28 bridge huts (a neutral hut at each end of every bridge, 21 more roster entries): 0d3b47e3fa717ca1 -> 7c7b18117108b369; T28 widened Tri-Point piers (slanted piers stay 4-connected, the diagonal bridges to the rig are crossable) and structures are fixed in separation: 7c7b18117108b369 -> a12f5efb7108b369; T39 Tri-Point at 2x (260x232, every distance doubled; same layout and ratios): a12f5efb7108b369 -> 255bc1d1c339b9a5
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/tri-point-skirmish.json --expect 2bcbd19720900add  # T36 skirmish start: MCV deploy + reactor on Tri-Point; T27 re-pin: Ascendant seed-core seated and deployed (1v1v1); T28 re-pin: neutral oil derrick on the rig: 13b90027de9182fe -> 023dd8ce8ce6ba44; T28 bridge huts: 023dd8ce8ce6ba44 -> a1393a9220900add; T28 widened Tri-Point piers (slanted piers stay 4-connected, the diagonal bridges to the rig are crossable) and structures are fixed in separation: a1393a9220900add -> 3ce5ff7020900add; T39 Tri-Point at 2x (260x232, every distance doubled; same layout and ratios): 3ce5ff7020900add -> 2bcbd19720900add
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/counters-6v4.json --expect d2343b13b00b679f  # re-pinned for T05 guard (idle units hold, chase, return): a418be859c7550c7 -> 39ac951e73e99076; T29 re-pin: Rifleman marks on hit (+25% Coalition damage on marked targets): 39ac951e73e99076 -> d2343b13b00b679f
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/guard-hold.json --expect 26db13b0d757bcea  # T29 re-pin: Rifleman marks on hit (+25% Coalition damage on marked targets): e7a820c12422dad2 -> 26db13b0d757bcea
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/match-end.json --expect 3c7502ae4d9d4698  # T29 re-pin: Rifleman marks on hit (+25% Coalition damage on marked targets): 3c75053acd9d4698 -> 3c7502ae4d9d4698
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/economy-2h.json --expect 05829563b6901d19
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/produce-1t1.json --expect 5752e0ece297f09b  # re-pinned for T33 refinery entities: 2cb5e49325482ab9 -> 5752e0ece297f09b (refinery moved off the ore, ships a harvester; units spawn at cell centres; was T31 d854ebb325482ab9 -> 2cb5e49325482ab9)
      - run: dotnet format RTS.sln --verify-no-changes
      - run: _scripts/check.sh

  godot:
    name: godot headless import + build
    # Runs on push to main too, not just PRs. The pull_request-only guard let a
    # compile error in game/Main.cs reach main in the bootstrap commit and sit
    # there undetected. Actions is free on this public repo, so there is no
    # longer a minutes argument for skipping it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: false
      - run: dotnet build game/Game.csproj
      - run: godot --path game --headless --import --quit || true
      - run: godot --path game --headless --quit
