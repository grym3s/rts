name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    name: sim build + test + structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet restore RTS.sln
      - run: dotnet build RTS.sln --no-restore -warnaserror
      - run: dotnet test sim/tests/Sim.Tests.csproj --no-build --nologo
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/smoke.json
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/chokepoint-30.json --expect 1727e6d2adb5efb8
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/skirmish-10v10.json --expect e97bc24d4f7fd6c3  # re-pinned for T05 guard (idle units hold, chase, return): 0fbba65f760574ce -> e97bc24d4f7fd6c3
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/tri-point-30.json --expect 5526cd76fdce4754  # re-pinned for T05 guard (idle units hold, chase, return): 7e1eb94ae7d983f3 -> 5526cd76fdce4754
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/counters-6v4.json --expect 39ac951e73e99076  # re-pinned for T05 guard (idle units hold, chase, return): a418be859c7550c7 -> 39ac951e73e99076
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/guard-hold.json --expect e7a820c12422dad2
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/match-end.json --expect 3c75053acd9d4698
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/economy-2h.json --expect 05829563b6901d19
      - run: dotnet run --project tools/scenario/Scenario.csproj --no-build -- content/scenarios/produce-1t1.json --expect 2cb5e49325482ab9  # re-pinned for T31 footprints: d854ebb325482ab9 -> 2cb5e49325482ab9 (buildings stand at their footprint centre)
      - run: dotnet format RTS.sln --verify-no-changes
      - run: _scripts/check.sh

  godot:
    name: godot headless import + build
    # Runs on push to main too, not just PRs. The pull_request-only guard let a
    # compile error in game/Main.cs reach main in the bootstrap commit and sit
    # there undetected. Actions is free on this public repo, so there is no
    # longer a minutes argument for skipping it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: false
      - run: dotnet build game/Game.csproj
      - run: godot --path game --headless --import --quit || true
      - run: godot --path game --headless --quit
